<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17362f"><meta name="apple-mobile-web-app-title" content="Shared Trips">
  <title>Shared Trips</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/home.css?v=__CACHE_VERSION__">
  <script>window.SHARED_TRIP_HOSTED=true;</script>
</head>
<body>
  <header><a class="brand" href="/"><img src="/icons/icon-192.png" alt="" width="52" height="52"><span>Shared Trips</span></a><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option></select><button id="logout" hidden>Sign out</button></header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="login" hidden><h1 data-text="signin">Sign in</h1><form id="login-form"><label><span data-text="token">Admin token</span><input name="token" type="password" required autocomplete="off"></label><button data-text="signin">Sign in</button></form></section>
    <section id="trips" hidden><div class="heading"><h1 data-text="yourTrips">Your trips</h1><button id="create" data-text="create">Create trip</button></div><div class="tools"><label><input id="archived" type="checkbox"><span data-text="archived">Show archived</span></label><label class="import"><span data-text="import">Import JSON</span><input id="import" type="file" accept="application/json,.json"></label><button id="retry" data-text="retry">Refresh</button></div><div id="list" class="trip-list"></div></section>
  </main>
  <script type="module" src="/home.js?v=__CACHE_VERSION__"></script>
</body></html>
