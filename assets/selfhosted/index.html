<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17362f"><meta name="apple-mobile-web-app-title" content="Shared Trips">
  <title>Shared Trips</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/home.css?v=__CACHE_VERSION__">
  <script>window.SHARED_TRIP_HOSTED=true;</script>
</head>
<body>
  <header><a class="brand" href="/"><img src="/icons/icon-192.png" alt="" width="52" height="52"><span>Shared Trips</span></a><select id="language" aria-label="Language"><option value="en">English</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option></select><button id="logout" hidden>Sign out</button></header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="login" hidden>
      <h1 data-text="viewerSignin">Sign in</h1>
      <form id="viewer-login-form"><label><span data-text="username">Username</span><input name="username" type="text" required minlength="3" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label><span data-text="pw">Password</span><input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button data-text="signin">Sign in</button></form>
      <details id="invite-panel"><summary data-text="haveInvite">Have an invitation?</summary>
        <form id="invite-form"><label><span data-text="inviteCode">Invitation code</span><input name="invitation" type="text" required minlength="32" maxlength="128" autocomplete="off" autocapitalize="none" spellcheck="false"></label><label><span data-text="username">Username</span><input name="username" type="text" required minlength="3" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false"></label><label><span data-text="pw">Password</span><input name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></label><button data-text="requestAccess">Request access</button></form>
      </details>
      <details id="owner-panel"><summary data-text="ownerSignin">Owner sign-in</summary>
        <form id="login-form"><label><span data-text="token">Admin token</span><input name="token" type="password" required autocomplete="off"></label><button data-text="signin">Sign in</button></form>
      </details>
    </section>
    <section id="trips" hidden><div class="heading"><h1 data-text="yourTrips">Your trips</h1><button id="create" data-text="create">Create trip</button></div><p id="read-only-note" class="note" data-text="readOnly" hidden></p><div class="tools"><label><input id="archived" type="checkbox"><span data-text="archived">Show archived</span></label><label class="import" id="import-control"><span data-text="import">Import JSON</span><input id="import" type="file" accept="application/json,.json"></label><button id="retry" data-text="retry">Refresh</button></div><div id="list" class="trip-list"></div></section>
    <section id="accounts" hidden><div class="heading"><h2 data-text="accounts">Viewer accounts</h2><button id="create-invite" type="button" data-text="createInvite">Create invitation</button></div><output id="invite-output" class="invite-output" hidden></output><p id="invite-count" class="note"></p><ul id="account-list" class="account-list"></ul></section>
  </main>
  <script type="module" src="/home.js?v=__CACHE_VERSION__"></script>
</body></html>
